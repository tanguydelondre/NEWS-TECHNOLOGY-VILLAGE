services:
  - type: web
    name: ntv-boutique
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WHATSAPP_NUMBER
        value: 229014222197
      - key: DATABASE_URL
        sync: false
